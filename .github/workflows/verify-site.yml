name: Verify NibbleSpot live site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-site.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live PWA assets and backend
        shell: bash
        run: |
          set -euo pipefail
          for path in / /download /app.js /install-state.js /icon.svg /manifest.webmanifest /sw.js; do
            echo "Checking $path"
            curl --fail-with-body --location --max-time 30 --retry 2 --retry-delay 2 "https://restaurant.ajdapp.org$path" -o /dev/null
          done
          curl --fail-with-body --max-time 30 --retry 2 --retry-delay 2 "https://restaurant.ajdapp.org/api/health" -o health.json
          python3 - <<'PY'
          import json
          d=json.load(open('health.json'))
          print('Health:',d)
          assert d.get('ok') is True, d
          assert d.get('ai') is True, 'Missing AI binding'
          PY
      - name: Check PWA and native app install-aware UI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 "https://restaurant.ajdapp.org/install-state.js" -o install-state.js
          curl -fsSL --max-time 20 "https://restaurant.ajdapp.org/" -o installed-home.html
          curl -fsSL --max-time 20 "https://restaurant.ajdapp.org/download" -o installed-download.html
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL --max-time 20 "https://restaurant.ajdapp.org/sw.js?verify=install-aware-v3" -o installed-sw.js
            if grep -q "/install-state.js" installed-sw.js; then break; fi
            echo "Waiting for latest service worker deployment..."
            sleep 3
          done
          node --check install-state.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const js=fs.readFileSync('install-state.js','utf8');
          function verify(description,{ua='',pwa=false,ios=false,bridge=false}={},expected){
            const root={dataset:{}};
            const win={addEventListener(){},matchMedia:()=>({matches:pwa,addEventListener(){}})};
            if(bridge)win.nibbleIntro={finish(){}};
            const sandbox={window:win,navigator:{userAgent:ua,standalone:ios},document:{documentElement:root,addEventListener(){}}};
            vm.runInNewContext(js,sandbox);
            assert.strictEqual(root.dataset.nibbleInstalled,expected?'true':'false',description);
            assert.strictEqual(win.NibbleSpotInstallState.isInstalled(),expected,description);
            console.log(description,'→',expected?'installed':'regular website');
          }
          verify('Desktop Chrome',{ua:'Mozilla/5.0 Chrome/145.0'},false);
          verify('Android Chrome',{ua:'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/145 Mobile Safari/537.36'},false);
          verify('iPhone Safari',{ua:'Mozilla/5.0 (iPhone) AppleWebKit/605.1.15 Mobile/15E148'},false);
          verify('Installed browser PWA',{pwa:true},true);
          verify('Installed iOS home screen',{ios:true},true);
          verify('Existing Windows/Mac Electron app',{bridge:true},true);
          verify('Existing Android APK',{ua:'Mozilla/5.0 (Linux; Android 15; Pixel; wv) AppleWebKit/537.36 Version/4.0 Chrome/145.0.0.0 Mobile Safari/537.36'},true);
          verify('Branded Android app',{ua:'Mozilla/5.0 Chrome/145 NibbleSpotAndroidApp/1.0'},true);
          const home=fs.readFileSync('installed-home.html','utf8');
          const download=fs.readFileSync('installed-download.html','utf8');
          const sw=fs.readFileSync('installed-sw.js','utf8');
          assert(home.includes('src="/install-state.js"'));
          assert((home.match(/data-install-promo/g)||[]).length>=5);
          assert(home.includes('html[data-nibble-installed="true"] [data-install-promo]'));
          assert(download.includes('class="installed-app-view"')&&download.includes('data-install-promo'));
          assert(download.includes('src="/install-state.js"'));
          assert(sw.includes('/install-state.js'));
          console.log('All installed-app UI and caching checks passed');
          NODE

      - name: Verify live appearance themes and saved system preference
        shell: bash
        run: |
          set -euo pipefail
          for path in /theme.js /theme.css; do
            ok=false
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl -fsSL --max-time 25 "https://restaurant.ajdapp.org$path" -o "$(basename "$path")"; then ok=true; break; fi
              echo "Waiting for Cloudflare deployment of $path ($attempt)"
              sleep 4
            done
            if [ "$ok" != "true" ]; then echo "Missing $path"; exit 1; fi
          done
          curl -fsSL --max-time 25 'https://restaurant.ajdapp.org/' -o appearance-index.html
          curl -fsSL --max-time 25 'https://restaurant.ajdapp.org/download' -o appearance-download.html
          node --check theme.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('node:assert/strict');
          const source=fs.readFileSync('theme.js','utf8');
          function simulate(initial,systemDark){
            const saved=new Map(initial?[['nibblespot_appearance',initial]]:[]);
            const attr={},meta={content:''},listeners={};
            const media={matches:systemDark,addEventListener(name,cb){listeners['media:'+name]=cb;}};
            const root={style:{},setAttribute(k,v){attr[k]=v}};
            const document={documentElement:root,readyState:'loading',
              querySelector(s){return s==='meta[name="theme-color"]'?{setAttribute(_k,v){meta.content=v}}:null},
              querySelectorAll(){return []},getElementById(){return null},addEventListener(){}};
            const ctx={document,window:{matchMedia(){return media},addEventListener(k,cb){listeners[k]=cb}},
              localStorage:{getItem:k=>saved.get(k)||null,setItem:(k,v)=>saved.set(k,v)}};
            vm.runInNewContext(source,ctx);
            return {theme:ctx.window.NibbleSpotTheme,attr,media,listeners,saved,meta,root};
          }
          const a=simulate(null,false);
          assert.equal(a.theme.preference,'system');
          assert.equal(a.theme.effective,'light');
          a.media.matches=true;a.listeners['media:change']();
          assert.equal(a.theme.effective,'dark','system should follow device change');
          assert.equal(a.attr['data-theme'],'dark');
          a.theme.set('ultra-dark');
          assert.equal(a.theme.effective,'ultra-dark');
          assert.equal(a.saved.get('nibblespot_appearance'),'ultra-dark');
          assert.equal(a.meta.content,'#050506');
          a.media.matches=false;a.listeners['media:change']();
          assert.equal(a.theme.effective,'ultra-dark','manual theme overrides OS');
          a.theme.set('system');assert.equal(a.theme.effective,'light');
          const b=simulate('dark',false);
          assert.equal(b.theme.effective,'dark','saved manual theme must load');
          assert.equal(b.root.style.colorScheme,'dark');
          const stylesheet=fs.readFileSync('theme.css','utf8');
          for(const mode of ['light','dark','ultra-dark'])assert(stylesheet.includes('data-theme="'+mode+'"'));
          for(const name of ['preview-light','preview-dark','preview-ultra-dark','preview-system','nibble-settings-btn'])assert(stylesheet.includes(name));
          for(const html of ['appearance-index.html','appearance-download.html']){
            const page=fs.readFileSync(html,'utf8');
            assert(page.includes('src="/theme.js"')&&page.includes('href="/theme.css"'),html);
          }
          console.log('System, Light, Dark and Ultra Dark modes passed theme switching tests.');
          NODE

      - name: Verify Apple Maps, auto-capitalization and desktop download page
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 "https://restaurant.ajdapp.org/app.js" -o app.js
          curl -fsSL --max-time 20 "https://restaurant.ajdapp.org/" -o index.html
          curl -fsSL --max-time 20 "https://restaurant.ajdapp.org/download" -o download.html
          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          a=Path('app.js').read_text()
          i=Path('index.html').read_text()
          d=Path('download.html').read_text()
          assert 'function autoCapitalizeWords' in a, 'Missing input capitalization'
          assert 'function openAppleMapsSearch' in a and 'maps.apple.com' in a
          assert '🍎 Apple Maps' in a, 'No Apple Maps restaurant card link'
          assert "links.append(details,map,apple,book)" in a, 'No Apple Maps or detail links on saved restaurants'
          assert 'Apple Maps Search' in i, 'No Apple Maps search control'
          for name in ('NibbleSpot-Windows-Setup.exe','NibbleSpot-macOS.dmg','NibbleSpot-Android.apk'):
              assert name in d, 'Missing downloadable option: '+name
          assert 'data-platform="mac"' in d and 'data-platform="windows"' in d
          print('Live UI contains working app JavaScript, Apple Maps and cross-platform download choices.')
          PY

      - name: Check live destination autocomplete and UI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 25 "https://restaurant.ajdapp.org/api/locations?q=Miami" -o locations.json
          curl -fsSL --max-time 20 "https://restaurant.ajdapp.org/app.js" -o locations-app.js
          curl -fsSL --max-time 20 "https://restaurant.ajdapp.org/" -o locations-index.html
          node --check locations-app.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('locations.json').read_text())
          places=data.get('suggestions',[])
          assert isinstance(places,list) and places, data
          assert any('Miami' in (x.get('label') or '') for x in places), data
          assert all(isinstance(x.get('lat'),(int,float)) and isinstance(x.get('lon'),(int,float)) for x in places), places
          app=Path('locations-app.js').read_text()
          page=Path('locations-index.html').read_text()
          assert 'queueLocationSuggestions' in app and 'ArrowDown' in app and 'ArrowUp' in app
          assert 'role="combobox"' in page and 'role="listbox"' in page
          print('Autocomplete verified:',[x['label'] for x in places[:5]])
          PY

      - name: Check precise location and restaurant-name suggestions
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --retry-delay 1 --max-time 30 "https://restaurant.ajdapp.org/api/locations?q=Miami%20Beach" -o precise-places.json
          curl -fsSL --retry 2 --retry-delay 1 --max-time 30 "https://restaurant.ajdapp.org/api/locations?q=33020" -o zip-places.json
          curl -fsSL --retry 2 --retry-delay 1 --max-time 30 "https://restaurant.ajdapp.org/api/locations?q=Pennsylvania%20Avenue%20Washington" -o street-places.json
          curl -fsSL --retry 2 --retry-delay 1 --max-time 30 "https://restaurant.ajdapp.org/api/restaurant-suggestions?q=pizza&location=Miami%2C%20FL" -o nearby-name-suggestions.json
          curl -fsSL --max-time 25 "https://restaurant.ajdapp.org/app.js" -o precise-app.js
          curl -fsSL --max-time 25 "https://restaurant.ajdapp.org/" -o precise-index.html
          node --check precise-app.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          places=json.loads(Path('precise-places.json').read_text())
          shops=json.loads(Path('nearby-name-suggestions.json').read_text())
          zip_matches=json.loads(Path('zip-places.json').read_text()).get('suggestions',[])
          street_matches=json.loads(Path('street-places.json').read_text()).get('suggestions',[])
          assert isinstance(places.get('suggestions'),list),places
          assert isinstance(shops.get('suggestions'),list),shops
          assert zip_matches and zip_matches[0].get('kind') == 'ZIP code', zip_matches
          assert zip_matches[0].get('name') == '33020', zip_matches
          assert 'Florida' in zip_matches[0].get('label',''),zip_matches
          assert all({'lat','lon','name','address','id'} <= item.keys() for item in shops['suggestions']),shops
          app=Path('precise-app.js').read_text()
          page=Path('precise-index.html').read_text()
          assert '/api/restaurant-suggestions?' in app
          assert 'chooseRestaurantSuggestion' in app
          assert 'role="combobox"' in page and 'id="restaurantSuggestions"' in page
          assert 'ZIP code' in page and 'street address' in page
          assert 'ArrowDown' in app and 'ArrowUp' in app
          print('City and address suggestions:',len(places['suggestions']))
          print('ZIP code suggestions:',[(x['label'],x['kind']) for x in zip_matches[:4]])
          print('Street suggestions:',[(x['label'],x['kind']) for x in street_matches[:4]])
          print('Actual restaurant name suggestions:',len(shops['suggestions']))
          print('Sample restaurant names:',[s['name'] for s in shops['suggestions'][:5]])
          PY

      - name: Check restaurant search result
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 55 "https://restaurant.ajdapp.org/api/search?location=Miami%2C%20FL&q=pizza" -o search.json
          echo "Restaurant search response received."
          python3 - <<'PY'
          import json
          d=json.load(open('search.json'))
          print('Search returned',len(d.get('results',[])),'actual listings, message:',d.get('message'))
          assert isinstance(d.get('results'),list)
          assert d.get('source','').startswith('OpenStreetMap'), d
          PY

      - name: Verify interactive restaurant cards and on-demand detail records
        shell: bash
        run: |
          set -euo pipefail
          for file in details.js app.js; do
            curl -fsSL --max-time 25 "https://restaurant.ajdapp.org/$file" -o "$file"
            node --check "$file"
          done
          curl -fsSL --max-time 25 "https://restaurant.ajdapp.org/" -o restaurant-details-index.html
          curl -fsSL --max-time 25 "https://restaurant.ajdapp.org/api/restaurant-details?id=not-a-restaurant" -o invalid-details.json
          curl -fsSL --max-time 50 "https://restaurant.ajdapp.org/api/search?location=Miami%2C%20FL&q=Versailles" -o restaurant-details-list.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import urlopen
          html=Path('restaurant-details-index.html').read_text()
          js=Path('details.js').read_text()
          app=Path('app.js').read_text()
          invalid=json.loads(Path('invalid-details.json').read_text())
          assert invalid.get('details') is None, invalid
          assert 'id="restaurantDetailsModal"' in html
          assert 'id="restaurantDetailContent"' in html
          assert 'id="detailDirectionsBtn"' in html
          assert 'src="/details.js"' in html
          for tab in ['overview','contact','map']:
              assert 'data-detail-tab="'+tab+'"' in html, tab
          assert '/api/restaurant-details?id=' in js
          assert 'function openById' in js and 'function close' in js
          assert 'restaurant-detail-map' in js
          assert 'window.showRestaurantDetails' in js
          assert "container.querySelectorAll('.card[data-details-id]')" in app
          assert 'saved-details-btn' in app
          results=json.loads(Path('restaurant-details-list.json').read_text()).get('results',[])
          osm_ids=[r['id'] for r in results if r.get('id','').startswith('osm-')]
          if osm_ids:
              with urlopen('https://restaurant.ajdapp.org/api/restaurant-details?id='+osm_ids[0],timeout=32) as response:
                  data=json.load(response)
              assert 'details' in data, data
              if data['details']:
                  assert data['details'].get('source') == 'OpenStreetMap', data
                  print('Live detail fields:',list(data['details']))
              else:
                  print('Upstream OSM detail provider unavailable; graceful fallback:',data.get('message'))
          print('Interactive restaurant details and source validation verified')
          PY

      - name: Check exact names, wider restaurant discovery, and Google fallback
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 --retry 1 "https://restaurant.ajdapp.org/api/search?location=Miami%2C%20FL&q=Versailles" -o named.json
          curl -fsSL --max-time 60 --retry 1 "https://restaurant.ajdapp.org/api/search?location=Hollywood%2C%20FL&q=Pizza%20Hut" -o brand.json
          curl -fsSL --max-time 20 'https://restaurant.ajdapp.org/' -o deep-index.html
          curl -fsSL --max-time 20 'https://restaurant.ajdapp.org/app.js' -o deep-app.js
          curl -fsSL --max-time 20 'https://restaurant.ajdapp.org/api/health' -o deep-health.json
          node --check deep-app.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('named.json').read_text())
          b=json.loads(Path('brand.json').read_text())
          health=json.loads(Path('deep-health.json').read_text())
          for request,data in [('Versailles',a),('Pizza Hut',b)]:
              assert isinstance(data.get('results'),list),data
              print(request,':',len(data['results']),'matched; provider:',data.get('source'))
              print('Restaurant names:',[r['name'] for r in data['results'][:5]])
              if data['results'] and data['source']!='Google Places':
                  assert any(request.lower() in r['name'].lower() for r in data['results']),data
          app=Path('deep-app.js').read_text()
          html=Path('deep-index.html').read_text()
          assert 'function openGoogleMapsSearch' in app
          assert 'function openGoogleResearch' in app
          assert 'getGoogleMapsDeepUrl' in app and 'getGoogleResearchUrl' in app
          assert 'googleMapsDeepLink' in html and 'googleWebDeepLink' in html
          assert 'Search Google Maps' in html
          assert 'No restaurants match this filter' in app
          assert 'function openResearchUrl' in app
          assert 'window.location.assign(url)' in app
          assert 'window.location.assign(link.href)' in app
          assert 'No verified in-app match yet' in app
          assert 'googlePlaces' in health
          print('Google Places API configured:',health['googlePlaces'])
          print('Deep search and fallback UI verified.')
          PY

      - name: Check AI-powered restaurant search
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 55 \
            -H 'Content-Type: application/json' \
            -d '{"location":"Miami, FL","q":"pizza in Miami"}' \
            'https://restaurant.ajdapp.org/api/ai-search' -o ai.json
          echo "AI search response received."
          python3 - <<'PY'
          import json
          d=json.load(open('ai.json'))
          print('AI interpretation:',d.get('aiNote'))
          print('Results:',len(d.get('results',[])))
          assert isinstance(d.get('results'),list), d
          assert 'AI interpreted' in d.get('aiNote',''), d.get('aiNote')
          PY
