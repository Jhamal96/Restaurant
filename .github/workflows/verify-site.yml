name: Verify NibbleSpot live site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-site.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live PWA assets and backend
        shell: bash
        run: |
          set -euo pipefail
          for path in / /download /app.js /install-state.js /icon.svg /manifest.webmanifest /sw.js; do
            echo "Checking $path"
            curl --fail-with-body --location --max-time 30 --retry 2 --retry-delay 2 "https://restaurant.ajdapp.org$path" -o /dev/null
          done
          curl --fail-with-body --max-time 30 --retry 2 --retry-delay 2 "https://restaurant.ajdapp.org/api/health" -o health.json
          python3 - <<'PY'
          import json
          d=json.load(open('health.json'))
          print('Health:',d)
          assert d.get('ok') is True, d
          assert d.get('ai') is True, 'Missing AI binding'
          PY
      - name: Check PWA and native app install-aware UI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 "https://restaurant.ajdapp.org/install-state.js" -o install-state.js
          curl -fsSL --max-time 20 "https://restaurant.ajdapp.org/" -o installed-home.html
          curl -fsSL --max-time 20 "https://restaurant.ajdapp.org/download" -o installed-download.html
          curl -fsSL --max-time 20 "https://restaurant.ajdapp.org/sw.js" -o installed-sw.js
          node --check install-state.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const js=fs.readFileSync('install-state.js','utf8');
          function verify(description,{ua='',pwa=false,ios=false,bridge=false}={},expected){
            const root={dataset:{}};
            const win={addEventListener(){},matchMedia:()=>({matches:pwa,addEventListener(){}})};
            if(bridge)win.nibbleIntro={finish(){}};
            const sandbox={window:win,navigator:{userAgent:ua,standalone:ios},document:{documentElement:root,addEventListener(){}}};
            vm.runInNewContext(js,sandbox);
            assert.strictEqual(root.dataset.nibbleInstalled,expected?'true':'false',description);
            assert.strictEqual(win.NibbleSpotInstallState.isInstalled(),expected,description);
            console.log(description,'→',expected?'installed':'regular website');
          }
          verify('Desktop Chrome',{ua:'Mozilla/5.0 Chrome/145.0'},false);
          verify('Android Chrome',{ua:'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/145 Mobile Safari/537.36'},false);
          verify('iPhone Safari',{ua:'Mozilla/5.0 (iPhone) AppleWebKit/605.1.15 Mobile/15E148'},false);
          verify('Installed browser PWA',{pwa:true},true);
          verify('Installed iOS home screen',{ios:true},true);
          verify('Existing Windows/Mac Electron app',{bridge:true},true);
          verify('Existing Android APK',{ua:'Mozilla/5.0 (Linux; Android 15; Pixel; wv) AppleWebKit/537.36 Version/4.0 Chrome/145.0.0.0 Mobile Safari/537.36'},true);
          verify('Branded Android app',{ua:'Mozilla/5.0 Chrome/145 NibbleSpotAndroidApp/1.0'},true);
          const home=fs.readFileSync('installed-home.html','utf8');
          const download=fs.readFileSync('installed-download.html','utf8');
          const sw=fs.readFileSync('installed-sw.js','utf8');
          assert(home.includes('src="/install-state.js"'));
          assert((home.match(/data-install-promo/g)||[]).length>=5);
          assert(home.includes('html[data-nibble-installed="true"] [data-install-promo]'));
          assert(download.includes('class="installed-app-view"')&&download.includes('data-install-promo'));
          assert(download.includes('src="/install-state.js"'));
          assert(sw.includes('/install-state.js'));
          console.log('All installed-app UI and caching checks passed');
          NODE

      - name: Verify Apple Maps, auto-capitalization and desktop download page
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 "https://restaurant.ajdapp.org/app.js" -o app.js
          curl -fsSL --max-time 20 "https://restaurant.ajdapp.org/" -o index.html
          curl -fsSL --max-time 20 "https://restaurant.ajdapp.org/download" -o download.html
          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          a=Path('app.js').read_text()
          i=Path('index.html').read_text()
          d=Path('download.html').read_text()
          assert 'function autoCapitalizeWords' in a, 'Missing input capitalization'
          assert 'function openAppleMapsSearch' in a and 'maps.apple.com' in a
          assert '🍎 Apple Maps' in a, 'No Apple Maps restaurant card link'
          assert "links.append(map,apple,book)" in a, 'No Apple Maps saved link'
          assert 'Apple Maps Search' in i, 'No Apple Maps search control'
          for name in ('NibbleSpot-Windows-Setup.exe','NibbleSpot-macOS.dmg','NibbleSpot-Android.apk'):
              assert name in d, 'Missing downloadable option: '+name
          assert 'data-platform="mac"' in d and 'data-platform="windows"' in d
          print('Live UI contains working app JavaScript, Apple Maps and cross-platform download choices.')
          PY

      - name: Check live destination autocomplete and UI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 25 "https://restaurant.ajdapp.org/api/locations?q=Miami" -o locations.json
          curl -fsSL --max-time 20 "https://restaurant.ajdapp.org/app.js" -o locations-app.js
          curl -fsSL --max-time 20 "https://restaurant.ajdapp.org/" -o locations-index.html
          node --check locations-app.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('locations.json').read_text())
          places=data.get('suggestions',[])
          assert isinstance(places,list) and places, data
          assert any('Miami' in (x.get('label') or '') for x in places), data
          assert all(isinstance(x.get('lat'),(int,float)) and isinstance(x.get('lon'),(int,float)) for x in places), places
          app=Path('locations-app.js').read_text()
          page=Path('locations-index.html').read_text()
          assert 'queueLocationSuggestions' in app and 'ArrowDown' in app and 'ArrowUp' in app
          assert 'role="combobox"' in page and 'role="listbox"' in page
          print('Autocomplete verified:',[x['label'] for x in places[:5]])
          PY

      - name: Check restaurant search result
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 55 "https://restaurant.ajdapp.org/api/search?location=Miami%2C%20FL&q=pizza" -o search.json
          echo "Restaurant search response received."
          python3 - <<'PY'
          import json
          d=json.load(open('search.json'))
          print('Search returned',len(d.get('results',[])),'actual listings, message:',d.get('message'))
          assert isinstance(d.get('results'),list)
          assert d.get('source','').startswith('OpenStreetMap'), d
          PY

      - name: Check AI-powered restaurant search
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 55 \
            -H 'Content-Type: application/json' \
            -d '{"location":"Miami, FL","q":"pizza in Miami"}' \
            'https://restaurant.ajdapp.org/api/ai-search' -o ai.json
          echo "AI search response received."
          python3 - <<'PY'
          import json
          d=json.load(open('ai.json'))
          print('AI interpretation:',d.get('aiNote'))
          print('Results:',len(d.get('results',[])))
          assert isinstance(d.get('results'),list), d
          assert 'AI interpreted' in d.get('aiNote',''), d.get('aiNote')
          PY
