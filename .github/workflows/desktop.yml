name: Build NibbleSpot Windows and macOS installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

concurrency:
  group: nibblespot-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installers:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: dist:win
            artifact: nibblespot-windows
          - os: macos-latest
            target: dist:mac
            artifact: nibblespot-macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build native installer
        working-directory: desktop
        run: npm run ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'false'
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish NibbleSpot desktop release
    needs: installers
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nibblespot-*
          merge-multiple: true
          path: dist
      - name: Publish test installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -lh dist/
          if gh release view desktop-latest >/dev/null 2>&1; then
            gh release upload desktop-latest dist/*.exe dist/*.dmg --clobber
          else
            gh release create desktop-latest dist/*.exe dist/*.dmg \
              --target "$GITHUB_SHA" \
              --title "NibbleSpot — Windows and macOS" \
              --notes "Unsigned testing installers for Windows 64-bit and macOS universal (Intel/Apple Silicon). These open restaurant.ajdapp.org in a secure desktop window. Internet required for restaurant and AI searches. Windows SmartScreen or macOS Gatekeeper may request verification. The GitHub repository is private, so signed-in authorized access is required to download." \
              --prerelease
          fi
